<div>
  <a href="#" class="form__buttons--a">
    <i class="bi bi-arrow-left"></i>
    Voltar
  </a>
  <h3 class="form__text--h3">Adicionar contato</h3>
  <form action="">
    <fieldset class="d-flex flex-column gap-4">
      <div class="input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping">
          <i class="bi bi-person"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Nome"
          aria-label="Nome"
          aria-describedby="addon-wrapping"
        />
      </div>
      <div class="input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping">
          <i class="bi bi-telephone"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Username"
          aria-label="Username"
          aria-describedby="addon-wrapping"
        />
      </div>
      <div class="input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping">
          <i class="bi bi-envelope"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Email"
          aria-label="Email"
          aria-describedby="addon-wrapping"
        />
      </div>
    </fieldset>
    <hr />
    <fieldset class="d-flex flex-column gap-4">
      <div class="input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping">
          <i class="bi bi-calendar"></i>
        </span>
        <input
          type="date"
          class="form-control"
          placeholder="Data de nascimento"
          aria-label="Data de nascimento"
          aria-describedby="addon-wrapping"
        />
      </div>
      <div class="input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping">
          <i class="bi bi-link"></i>
        </span>
        <input
          type="url"
          class="form-control"
          placeholder="Adicione o URL da página"
          aria-label="Adicione o URL da página"
          aria-describedby="addon-wrapping"
        />
      </div>
      <div class="input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping">
          <i class="bi bi-link"></i>
        </span>
        <textarea
          type="text"
          class="form-control"
          placeholder="Coloque observações nesse espaço.  Exemplo: “Instrutora da academia “Nova Imagem”, amiga da Júlia”."
          aria-label="Coloque observações nesse espaço.  Exemplo: “Instrutora da academia “Nova Imagem”, amiga da Júlia”."
          aria-describedby="addon-wrapping"
        ></textarea>
      </div>
    </fieldset>
    <fieldset
      class="form__buttons--container w-75 btn-group"
      role="group"
      aria-label="Basic outlined example"
    >
      <button type="button" class="btn form__buttons--delete">
        <i class="bi bi-x-lg"></i> Cancelar
      </button>
      <button type="button" class="btn form__buttons--edit">
        <i class="bi bi-cloud-plus"></i>
        Salvar contato
      </button>
    </fieldset>
  </form>
</div>
